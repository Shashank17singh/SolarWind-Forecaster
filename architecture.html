<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture - SolarWind-Forecaster</title>
              <meta name="color-scheme" content="dark">
  <meta name="darkreader-lock">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono&family=Geist:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap');
    
    :root {
      color-scheme: dark;
      --bg-body: #050505;
      --bg-container: #0a0a0a;
      --node-fill: #171717;
      --node-stroke: #404040;
      --node-text: #f5f5f5;
      --node-sub: #a3a3a3;
      --edge-stroke: #525252;
      --edge-text: #a3a3a3;
      --hover-node-stroke: #a3a3a3;
      --hover-node-fill: #262626;
      --hover-edge: #d4d4d4;
    }

    body { 
      margin: 0; 
      padding: 2rem; 
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; 
      background-color: var(--bg-body); 
      color: var(--node-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .diagram-container { 
      width: 100%; 
      max-width: 1200px;
      overflow-x: auto; 
      background-color: var(--bg-container); 
      border: 1px solid #262626; 
      border-radius: 12px; 
      padding: 3rem; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    
    svg { 
      width: 100%; 
      min-width: 960px; 
      display: block; 
    }

    .node rect { 
      fill: var(--node-fill); 
      stroke: var(--node-stroke); 
      stroke-width: 1.5; 
      rx: 6; 
      transition: all 0.2s ease;
    }
    .node:hover rect {
      stroke: var(--hover-node-stroke);
      fill: var(--hover-node-fill);
    }
    
    .node text { 
      fill: var(--node-text); 
      font-size: 10px; 
      font-weight: 600; 
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
    }
    .node .sub { 
      font-family: 'Geist Mono', 'Consolas', 'Courier New', monospace; 
      font-size: 7.5px; 
      font-weight: normal; 
      fill: var(--node-sub); 
    }
    .node:hover text {
      fill: #ffffff;
    }
    .node:hover .sub {
      fill: #d4d4d4;
    }
    
    .edge path { 
      fill: none; 
      stroke: var(--edge-stroke); 
      stroke-width: 1.5; 
      transition: all 0.2s ease;
    }
    .edge:hover path {
      stroke: var(--hover-edge);
      stroke-width: 2;
    }
    
    .edge text { 
      font-family: 'Geist Mono', 'Consolas', 'Courier New', monospace; 
      font-size: 8px; 
      fill: var(--edge-text); 
      paint-order: stroke fill;
      stroke: var(--bg-container);
      stroke-width: 8px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    
    .title { 
      font-family: 'Instrument Serif', Georgia, serif; 
      font-size: 26px; 
      fill: var(--node-text); 
    }
    .subtitle { 
      font-family: 'Geist Mono', 'Consolas', 'Courier New', monospace; 
      font-size: 9px; 
      fill: #737373; 
    }
    
    .zone { 
      fill: rgba(255,255,255,0.02); 
      stroke: rgba(255,255,255,0.1); 
      stroke-width: 1; 
      rx: 8; 
    }
    .zone-label { 
      font-family: 'Geist Mono', 'Consolas', 'Courier New', monospace; 
      font-size: 7px; 
      fill: rgba(255,255,255,0.4); 
      letter-spacing: 0.14em; 
    }

    @keyframes flow {
      to { stroke-dashoffset: -20; }
    }
    .edge path[stroke-dasharray] {
      animation: flow 1.5s linear infinite;
      stroke: var(--node-sub);
    }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
      <title id="title">SolarWind Forecaster Architecture</title>
      <desc id="desc">Data science pipeline and ML modeling</desc>
      
                                    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252" style="fill: context-stroke;" />
        </marker>
      </defs>

      <text x="40" y="60" class="title">SolarWind Forecaster</text>
      <text x="40" y="80" class="subtitle">Time-Series ML Pipeline for Geomagnetic Storm Risk</text>

      <!-- Zones -->
      <rect x="40" y="120" width="200" height="400" class="zone" />
      <text x="50" y="135" class="zone-label">DATA INGESTION</text>

      <rect x="280" y="120" width="200" height="400" class="zone" />
      <text x="290" y="135" class="zone-label">FEATURE ENGINEERING</text>

      <rect x="520" y="120" width="200" height="400" class="zone" />
      <text x="530" y="135" class="zone-label">MODEL TRAINING</text>

      <rect x="760" y="120" width="160" height="400" class="zone" />
      <text x="770" y="135" class="zone-label">INFERENCE & UI</text>

      <!-- Nodes -->
      <g class="node" transform="translate(60, 220)">
        <rect x="0" y="0" width="160" height="60" />
        <text x="80" y="25" text-anchor="middle" >NASA/NOAA Data</text>
        <text x="80" y="40" class="sub" text-anchor="middle" >1-min JSON/CSV</text>
      </g>
      <g class="node" transform="translate(60, 320)">
        <rect x="0" y="0" width="160" height="60" />
        <text x="80" y="25" text-anchor="middle" >Parsed CSVs</text>
        <text x="80" y="40" class="sub" text-anchor="middle" >omni / flare</text>
      </g>

      <g class="node" transform="translate(300, 270)">
        <rect x="0" y="0" width="160" height="60" />
        <text x="80" y="25" text-anchor="middle" >Rolling Windows</text>
        <text x="80" y="40" class="sub" text-anchor="middle" >Time-series Features</text>
      </g>

      <g class="node" transform="translate(540, 220)">
        <rect x="0" y="0" width="160" height="60" />
        <text x="80" y="25" text-anchor="middle" >Train/Test Split</text>
        <text x="80" y="40" class="sub" text-anchor="middle" >No Data Leakage</text>
      </g>
      <g class="node" transform="translate(540, 320)">
        <rect x="0" y="0" width="160" height="60" />
        <text x="80" y="25" text-anchor="middle" >Gradient Boosting</text>
        <text x="80" y="40" class="sub" text-anchor="middle" >Scikit-learn Regressor</text>
      </g>

      <g class="node" transform="translate(780, 220)">
        <rect x="0" y="0" width="120" height="60" />
        <text x="60" y="25" text-anchor="middle" >Streamlit App</text>
        <text x="60" y="40" class="sub" text-anchor="middle" >Dashboard</text>
      </g>
      <g class="node" transform="translate(780, 320)">
        <rect x="0" y="0" width="120" height="60" />
        <text x="60" y="25" text-anchor="middle" >Predictions</text>
        <text x="60" y="40" class="sub" text-anchor="middle" >Storm Risk %</text>
      </g>

      <!-- Edges -->
      <g class="edge">
        <path d="M 140 280 L 140 320" marker-end="url(#arrow)" />
        <path d="M 220 350 L 260 350 L 260 300 L 300 300" marker-end="url(#arrow)" />
        
        <path d="M 460 300 L 500 300 L 500 250 L 540 250" marker-end="url(#arrow)" />
        <path d="M 620 280 L 620 320" marker-end="url(#arrow)" />
        
        <path d="M 700 350 L 740 350 L 740 250 L 780 250" marker-end="url(#arrow)" />
        <path d="M 840 280 L 840 320" marker-end="url(#arrow)" />
      </g>
    </svg>
  </div>
</body>
</html>
