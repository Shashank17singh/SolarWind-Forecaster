name: Streamlit Keep-Alive

on:
  schedule:
    # Runs every 8 hours
    - cron: '20 */8 * * *'
  workflow_dispatch:

jobs:
  streamlit-keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Streamlit app alive
        uses: gpenessot/streamlit-keep-alive@main
        with:
          app-urls: |
            https://solarwind-forecaster.streamlit.app/
